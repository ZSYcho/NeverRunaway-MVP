name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, so a moved or hijacked tag can't change what runs here.
jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test

      - name: Seed a fresh anvil chain
        run: |
          anvil --silent &
          until cast chain-id >/dev/null 2>&1; do sleep 0.2; done
          forge script script/DevSeed.s.sol --rpc-url http://127.0.0.1:8545 --broadcast --silent
      - name: Seeded addresses match the committed deployment file
        run: git diff --exit-code -- ../packages/shared/src/deployments/31337.json

  workspace:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # `pnpm gen` builds the contracts to read their ABIs.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generated ABIs match the contracts
        run: |
          pnpm gen
          git diff --exit-code -- packages/shared/src/generated.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Transaction flows against a fresh anvil chain seeded by DevSeed.
      - run: pnpm test:anvil
      - run: pnpm build
