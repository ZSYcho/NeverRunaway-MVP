packages:
  - apps/*
  - packages/*

# Supply-chain guards: skip versions published in the last 24h, and only let
# explicitly approved packages run install scripts.
minimumReleaseAge: 1440
allowBuilds:
  # Only a version-consistency check across @reown/appkit packages; not needed to run.
  '@reown/appkit': false
  esbuild: true

# @wagmi/cli pins esbuild ~0.25 while Vite 8 wants ^0.27 || ^0.28 as an optional peer;
# one current esbuild serves both (`pnpm gen` exercises the wagmi side in CI).
overrides:
  esbuild: ^0.28.2

peerDependencyRules:
  allowedVersions:
    # Solana packages under WalletConnect's AppKit modal ask for TypeScript ^5 for their type
    # declarations, which skipLibCheck leaves unchecked.
    typescript: '6'

# One version per shared dependency across the workspace; packages reference it as "catalog:".
catalog:
  '@types/node': ^24.19.2
  oxlint: ^1.88.0
  prettier: ^3.9.10
  typescript: ~6.0.3
  viem: ^2.57.7
  vitest: ^5.0.5
  zod: ^4.6.7
